spring:
  application:
    name: workforge
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

workforge:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-very-long-dev-only-secret-key-1234567890}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    location: ${FILE_STORAGE_LOCATION:./data/attachments}
  seed:
    admin-email: ${WORKFORGE_ADMIN_EMAIL:admin@workforge.local}
    admin-username: ${WORKFORGE_ADMIN_USERNAME:admin}
    admin-password: ${WORKFORGE_ADMIN_PASSWORD:}
  ratelimit:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:100}
    refill-period-seconds: ${RATE_LIMIT_REFILL_PERIOD_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
