spring:
  datasource:
    url: jdbc:h2:mem:workforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: false

workforge:
  jwt:
    secret: test-secret-key-that-is-sufficiently-long-for-hmac-sha256-signing-0123456789
    access-expiration: 900000
    refresh-expiration: 604800000
  storage:
    location: ./target/test-attachments
  seed:
    admin-email: admin@workforge.local
    admin-username: admin
    admin-password: AdminPass123!

logging:
  level:
    com.avadhoot.workforge: INFO
